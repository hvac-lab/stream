<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morris North Stream</title>
<link rel="icon" href="data:,">
<style>
  /* Same look as the HVAC page (hvac.morrisnorth.org) */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
    --s1:#2a78d6; --s2:#eb6834; --band: rgba(42,120,214,0.10);
    --good:#0b8a0b; --warning:#b97c00; --critical:#c62f2f; --wait:#898781;
    --goodbg: rgba(12,163,12,.09); --warnbg: rgba(250,178,25,.14); --badbg: rgba(208,59,59,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --s1:#3987e5; --s2:#d95926; --band: rgba(57,135,229,.14);
      --good:#2fbf4f; --warning:#e0a12a; --critical:#ef6a6a;
      --goodbg: rgba(47,191,79,.12); --warnbg: rgba(224,161,42,.14); --badbg: rgba(239,106,106,.12);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --s1:#3987e5; --s2:#d95926; --band: rgba(57,135,229,.14);
    --good:#2fbf4f; --warning:#e0a12a; --critical:#ef6a6a;
    --goodbg: rgba(47,191,79,.12); --warnbg: rgba(224,161,42,.14); --badbg: rgba(239,106,106,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); color: var(--ink-2); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--good); } .pill.warn .dot { background: var(--warning); } .pill.bad .dot { background: var(--critical); }
  nav.tabs { display:flex; gap: 4px; padding: 8px 16px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav.tabs button { border: 1px solid transparent; border-bottom: none; background: none; border-radius: 10px 10px 0 0; padding: 8px 16px; font-size: 15px; color: var(--ink-2); }
  nav.tabs button.on { background: var(--page); border-color: var(--border); color: var(--ink); font-weight: 650; margin-bottom: -1px; }
  nav.tabs button .live { display:inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--s1); margin-left: 6px; vertical-align: middle; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  button, input[type=text], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  button { cursor: pointer; touch-action: manipulation; } button:hover { background: var(--hover); } button:disabled { opacity: .5; cursor: default; }
  button.google { display:inline-flex; align-items:center; gap:10px; padding: 10px 18px; font-weight: 600; font-size: 16px; }
  button.google svg { width: 20px; height: 20px; }
  button.big { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 12px; }
  button.manual { border: 2px solid var(--warning); color: var(--warning); }
  button.auto { border: 2px solid var(--good); color: var(--good); }
  button.yes { background: var(--warning); border-color: transparent; color: #fff; }
  button.primary { background: var(--s1); color: #fff; border-color: transparent; font-weight: 600; }
  button.small { padding: 3px 10px; font-size: 13px; } button.danger { color: var(--critical); }
  main { padding: 16px; max-width: 980px; margin: 0 auto; }
  main.narrow { max-width: 760px; }
  .hint { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .card > h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .card.test { border: 2px dashed var(--s1); }
  .runhead { display:flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .runhead h3 { margin: 0; font-size: 20px; line-height: 1.2; } .runhead .when { color: var(--muted); font-size: 13px; }
  .badge { display:inline-flex; align-items:center; gap:6px; font-size: 13px; font-weight: 650; padding: 4px 11px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.ok { color: var(--good); border-color: var(--good); background: var(--goodbg); }
  .badge.warning { color: var(--warning); border-color: var(--warning); background: var(--warnbg); }
  .badge.failed { color: var(--critical); border-color: var(--critical); background: var(--badbg); }
  .badge.running { color: var(--s1); border-color: var(--s1); background: var(--band); }
  .badge.skipped { color: var(--warning); border-color: var(--warning); }
  .badge.small { font-size: 12px; padding: 2px 9px; }
  ol.steps { list-style: none; margin: 14px 0 0; padding: 0; }
  ol.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  ol.steps li:first-child { border-top: none; }
  .num { width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 14px;
         border: 2px solid var(--wait); color: var(--wait); background: var(--surface); font-variant-numeric: tabular-nums; }
  li.ok .num { background: var(--good); border-color: var(--good); color: #fff; }
  li.warning .num { background: var(--warning); border-color: var(--warning); color: #fff; }
  li.failed .num { background: var(--critical); border-color: var(--critical); color: #fff; }
  li.running .num { border-color: var(--s1); color: var(--s1); animation: pulse 1.4s ease-in-out infinite; }
  li.skipped .num { border-style: dashed; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--band); } }
  .stepline { display:flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .stepline b { font-weight: 650; }
  .stat { font-size: 13px; font-weight: 650; white-space: nowrap; }
  li.ok .stat { color: var(--good); } li.warning .stat { color: var(--warning); } li.failed .stat { color: var(--critical); }
  li.running .stat { color: var(--s1); } li.pending .stat, li.skipped .stat { color: var(--muted); }
  .detail { font-size: 14px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
  li.failed .detail { color: var(--ink); background: var(--badbg); border-left: 3px solid var(--critical); padding: 6px 9px; border-radius: 6px; margin-top: 5px; }
  li.failed .detail::before { content: "Why: "; font-weight: 650; color: var(--critical); }
  li.warning .detail { border-left: 3px solid var(--warning); padding-left: 9px; }
  li.pending .detail, li.skipped .detail { color: var(--muted); }
  a { color: var(--s1); }
  .banner { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--warning); background: var(--warnbg); font-size: 14px; }
  .banner.info { border-color: var(--s1); background: var(--band); }
  .ctl { margin-top: 14px; }
  .confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--warning); border-radius: 12px; background: var(--warnbg); font-size: 14px; }
  .confirm p { margin: 0 0 10px; } .confirm .row { display:flex; gap: 8px; } .confirm .row button { flex: 1; padding: 11px; font-weight: 600; }
  .confirm input[type=text] { width: 100%; margin-bottom: 10px; font-size: 16px; padding: 8px 10px; }
  .msg { font-size: 14px; margin-top: 8px; } .msg.bad { color: var(--critical); } .msg.ok { color: var(--good); }
  .next { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--grid); }
  .next:first-of-type { border-top: none; }
  .next .what b { display:block; } .next .what span { color: var(--muted); font-size: 13px; }
  .next .mode { font-size: 13px; font-weight: 650; text-align: right; } .next .mode.auto { color: var(--good); } .next .mode.manual { color: var(--warning); }
  .next .who { grid-column: 1 / -1; font-size: 13px; color: var(--warning); margin-top: -2px; }
  .next button { grid-column: 1 / -1; } .next .confirm { grid-column: 1 / -1; margin-top: 0; }
  /* History table: every heading sorts, a row opens to its steps and hymns */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--ink); text-decoration: underline; }
  th[data-dir="asc"]::after { content: " \25B2"; font-size: 9px; } th[data-dir="desc"]::after { content: " \25BC"; font-size: 9px; }
  table.hist tbody tr.row { cursor: pointer; } table.hist tbody tr.row:hover td { background: var(--hover); }
  table.hist tr.row.open td { background: var(--band); border-bottom-color: transparent; }
  table.hist td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.hist td.date .tw { display:inline-block; width: 14px; color: var(--muted); }
  table.hist td.res { white-space: nowrap; }
  table.hist td.res small { display:block; color: var(--muted); font-size: 11px; margin-top: 3px; white-space: normal; }
  table.hist .pf { display:inline-block; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 6px; color: #fff; letter-spacing: .03em; }
  .pf.pass { background: var(--good); } .pf.fail { background: var(--critical); } .pf.run { background: var(--s1); } .pf.hand { background: var(--warning); }
  table.hist td.readings { min-width: 150px; }
  table.hist .svc-under { display: none; color: var(--ink-2); font-size: 12px; margin-left: 14px; }
  table.hist tr.detailrow > td { background: var(--page); padding: 6px 12px 16px; }
  .two { display:grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
  .stack { max-width: 860px; } .stack h4 + ol.steps { margin-top: 4px; } .stack .facts { margin-bottom: 4px; }
  .two h4, .stack h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
  table.hymns { font-size: 13px; } table.hymns td, table.hymns th { padding: 4px 6px; }
  table.hymns td.n { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.hymns td.how { color: var(--muted); font-size: 12px; }
  .facts { font-size: 14px; display:grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin-top: 6px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .testform { display:grid; gap: 10px; }
  .testform label.opt { display:flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .testform label.opt.on { border-color: var(--s1); background: var(--band); }
  .testform label.opt input { margin-top: 4px; } .testform label.opt b { display:block; } .testform label.opt span { font-size: 13px; color: var(--ink-2); }
  .testform select { width: 100%; font-size: 16px; padding: 10px; }
  table.admin td.email { overflow-wrap: anywhere; } table.admin td.act { white-space: nowrap; }
  .adminAdd { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top: 10px; }
  .adminAdd input[type=text] { padding: 8px 10px; font-size: 16px; }
  label.chk { display:inline-flex; align-items:center; gap:5px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
  .center { max-width: 460px; margin: 10vh auto; text-align: center; } .center p { color: var(--ink-2); }
  /* Stats and Copyright tabs */
  .seg { display:inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 14px; } .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--s1); color: #fff; font-weight: 650; }
  .toolbar { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar label { font-size: 13px; color: var(--ink-2); display:inline-flex; gap: 6px; align-items: center; }
  input[type=date] { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
  .tile b { display:block; font-size: 28px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; } .tile span { font-size: 12px; color: var(--muted); }
  .grid2 { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; } .grid2 > .card { margin-bottom: 0; min-width: 0; } .gridgap { height: 16px; }
  .bars { display:grid; gap: 5px; }
  .bar { display:grid; grid-template-columns: minmax(96px, 38%) 1fr 40px; align-items: center; gap: 8px; font-size: 13px; }
  .bar .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .bar .bt { height: 16px; } .bar .bf { display:block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar .bv { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; }
  .legend { display:flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; } .legend i { display:inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table.data td.nc, table.data th.nc { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data td { vertical-align: middle; } table.data td.nowrap { white-space: nowrap; }
  .more { margin-top: 8px; }
  .chip { display:inline-block; font-size: 12px; font-weight: 650; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; color: var(--ink-2); }
  .chip.copyrighted { color: var(--critical); border-color: var(--critical); background: var(--badbg); }
  .chip.public_domain { color: var(--good); border-color: var(--good); background: var(--goodbg); }
  .rightsedit { display:flex; gap: 6px; flex-wrap: wrap; align-items: center; } .rightsedit select, .rightsedit input { font-size: 14px; padding: 4px 6px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; gap: 4px; } .grid2 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { header { padding: 8px 12px; gap: 8px; } header h1 { font-size: 16px; } main { padding: 10px; }
    #who { display: none; } .pill { font-size: 11px; padding: 2px 8px; } header button { padding: 4px 8px; font-size: 13px; }
    nav.tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 8px 0; } nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs button { white-space: nowrap; flex: 0 0 auto; padding: 7px 12px; font-size: 14px; }
    .card { padding: 12px; border-radius: 14px; } .runhead h3 { font-size: 18px; }
    table { font-size: 13px; } th, td { padding: 7px 5px; } table.hist .opt-col, table.hist .svc-col, table.data .opt-col { display: none; }
    table.hist .svc-under { display: block; } table.hist td.date { white-space: normal; } table.hist td.readings { min-width: 0; }
    table.hist td.res small { display: none; } table.hist .pf { padding: 3px 7px; }
    table.admin { font-size: 12px; } table.admin .by { display: none; } table.admin td.act button { display: block; margin: 2px 0; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Morris North Stream</h1>
  <span id="pc" class="pill" title="The church PC reports in every minute"><span class="dot"></span><span id="pcText">connecting</span></span>
  <span class="spacer"></span>
  <span id="who" class="hint"></span>
  <button id="themeBtn" title="Light / dark">◐</button>
  <button id="signout" style="display:none">Sign out</button>
</header>
<nav class="tabs" id="tabs" style="display:none"></nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
// Status of the automatic Sunday / Wednesday stream at the church (Russ, 2026-11-09).
//   Now      the service happening now (or the latest) as 12 numbered steps, what comes next, "Run by hand".
//   History  every service: date, result (pass / fail), minister, readings; a row opens to its steps and hymns.
//   Tests    an admin starts a TEST of a past service (quick replay or full re-check) and watches it run.
//   Admin    who may sign in (admins only), the same way as on the HVAC page.
// Data: Supabase (the HVAC page's project), tables stream_* (supabase\stream_status*.sql), written by the
// church PC's scripts (Common.psm1 Set-MnStep). The page's own allow list is stream_allowed_users.

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const params = new URLSearchParams(location.search);
const demo = params.get("demo") === "1";
const store = { get(k, d) { try { const v = localStorage.getItem("stream." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("stream." + k, JSON.stringify(v)); } catch {} } };
const TABS = [["now", "Now"], ["history", "History"], ["stats", "Stats"], ["copyright", "Copyright"], ["tests", "Tests"], ["admin", "Admin"]];
const state = { sb: null, user: null, admin: false, tab: store.get("tab", "now"),
                sermons: null, hymns: null, rights: new Map(), statsAt: 0, sorts: store.get("sorts2", {}), showAll: new Set(),
                frame: store.get("frame", "2026"), statsView: store.get("statsView", "minister"), cr: store.get("cr2", { preset: "year", from: "", to: "", which: "only" }), crEdit: null, crMsg: null,
                runs: [], tests: [], requests: [], users: [], control: new Map(), schedule: null, pcSeen: null, timer: null,
                asking: null, busy: false, msg: null, openHist: new Set(), sort: store.get("sort", { key: "date", dir: "desc" }),
                testSource: null, testMode: "quick", testMsg: null };

const STATUS_WORD = { ok: "Successful", warning: "Done, with a warning", failed: "Failed", running: "In progress", pending: "Waiting", skipped: "Skipped" };
const DAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// ------------------------------------------------------------------ theme
const applyTheme = () => { const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
$("#themeBtn").onclick = () => { const cur = store.get("theme", null); const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = cur ? cur === "dark" : dark; store.set("theme", isDark ? "light" : "dark"); applyTheme(); };
applyTheme();

// ------------------------------------------------------------------ helpers
const main = $("#main");
// redraws keep the scroll position (the page refreshes itself and after each button)
const screen = (...kids) => { const y = window.scrollY; main.replaceChildren(...kids.filter(k => k != null)); window.scrollTo(0, y); };
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const atTime = (day, hhmm) => { const [h, m] = hhmm.split(":").map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d; };
const fmtTime = (d) => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtDay = (d) => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
const fmtShortDay = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtDate = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); if (s < 90) return "just now"; const m = Math.round(s / 60); if (m < 90) return `${m} min ago`;
  const h = Math.round(m / 60); return h < 36 ? `${h} h ago` : `${Math.round(h / 24)} days ago`; };
function linkify(text) {
  const out = document.createDocumentFragment(); let last = 0; const re = /https:\/\/vimeo\.com\/\d+\/[0-9a-z]+/gi; let m;
  while ((m = re.exec(text))) { out.append(text.slice(last, m.index), el("a", { href: m[0], target: "_blank", rel: "noopener" }, m[0])); last = m.index + m[0].length; }
  out.append(text.slice(last)); return out;
}
const serviceOf = (id) => (state.schedule?.services || []).find(s => s.id === id || "Test" + s.id === id) || null;
const stepOf = (run, key) => (run.steps || []).find(s => s.key === key) || {};

// The whole run in one word, from its steps.
function overall(run) {
  const st = (run.steps || []).map(s => s.status);
  const has = (x) => st.includes(x);
  if (has("skipped") && st.every(x => x === "skipped" || x === "pending")) return { cls: "skipped", text: "Run by hand" };
  if (has("running")) return { cls: "running", text: "In progress" };
  if (has("failed")) return { cls: "failed", text: "Failed" };
  const started = st.some(x => x !== "pending");
  const finished = stepOf(run, "report").status === "ok" || st.every(x => x !== "pending");
  if (started && !finished) {
    if (run.is_test) return { cls: "running", text: "In progress" };
    const svc = serviceOf(run.service_id); const day = parseYmd(run.run_date);
    const late = svc ? atTime(day, svc.cutoff).getTime() + 3 * 3600e3 : day.getTime() + 30 * 3600e3;
    return Date.now() < late ? { cls: "running", text: "In progress" } : { cls: "warning", text: "Not finished" };
  }
  if (has("skipped")) return { cls: "skipped", text: "Partly by hand" };
  if (has("warning")) return { cls: "warning", text: "Done, with warnings" };
  return { cls: "ok", text: "Successful" };
}
// History: PASS = the sermon is on (Vimeo and AC Central done); FAIL = it is not, or a step failed on the way.
function passFail(run) {
  const o = overall(run);
  if (o.cls === "running") return { cls: "run", text: "RUNNING", rank: 1 };
  if (o.cls === "skipped") return { cls: "hand", text: "BY HAND", rank: 2 };
  const on = stepOf(run, "vimeo").status === "ok" && stepOf(run, "accentral").status === "ok";
  return on ? { cls: "pass", text: "PASS", rank: 3 } : { cls: "fail", text: "FAIL", rank: 0 };
}
function problems(run) {
  const f = (run.steps || []).filter(s => s.status === "failed").map(s => s.label);
  const w = (run.steps || []).filter(s => s.status === "warning").map(s => s.label);
  const out = [];
  if (f.length) out.push(`${f.length} failed: ${f.join(", ")}`);
  if (w.length) out.push(`${w.length} warning${w.length > 1 ? "s" : ""}`);
  return out.join("; ");
}

// Scheduled services in the next weeks (same rule as the PC: weekday, and weeks of the month when given).
function upcoming(count = 5) {
  const out = []; const now = new Date();
  for (let i = 0; i < 45 && out.length < count; i++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    for (const s of (state.schedule?.services || [])) {
      if (!s.enabled || !(s.days || []).includes(DAY[day.getDay()])) continue;
      if (s.weeksOfMonth && !s.weeksOfMonth.includes(Math.floor((day.getDate() - 1) / 7) + 1)) continue;
      const end = atTime(day, s.cutoff);
      if (end < now) continue;
      out.push({ key: `${ymd(day)}_${s.id}`, svc: s, day, start: atTime(day, s.start), end });
    }
  }
  return out.sort((a, b) => a.start - b.start).slice(0, count);
}
const anyActive = () => [...state.runs, ...state.tests].some(r => overall(r).cls === "running") || state.requests.some(q => q.status === "pending" || q.status === "running");

  const sb = state.sb;
  const cols = "run_key,run_date,service_id,service_name,steps,summary,is_test,updated_at";
  const [runs, tests, ctl, meta, req] = await Promise.all([
    sb.from("stream_runs").select(cols).eq("is_test", false).order("run_date", { ascending: false }).order("run_key", { ascending: false }).limit(200),
    sb.from("stream_runs").select(cols).eq("is_test", true).order("updated_at", { ascending: false }).limit(10),

  for (const r of [runs, tests, ctl, meta, req]) if (r.error) throw new Error(r.error.message);
  state.runs = runs.data || []; state.tests = tests.data || []; state.requests = req.data || [];
  state.control = new Map((ctl.data || []).map(c => [c.run_key, c]));
  const m = Object.fromEntries((meta.data || []).map(x => [x.key, x.value]));

// ------------------------------------------------------------------ refresh loop: every 5 s while something runs, else 20 s
async function refresh() {
  clearTimeout(state.timer);
  try {
    await load();
    const statsTab = ["stats", "copyright"].includes(state.tab);
    if (statsTab && (!state.sermons || Date.now() - state.statsAt > 10 * 60e3)) { await loadStats(); if (state.crEdit === null) render(); }
    // do not redraw under an open confirmation, a form being filled in, the admin list or the stats being looked at
    if (!state.asking && state.tab !== "admin" && !statsTab && !(document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName))) render();
    else { setPc(); renderTabs(); }
  } catch (e) { screen(el("section", { class: "card" }, "Could not load the status: " + (e.message || e))); }
  state.timer = setTimeout(refresh, anyActive() ? 5000 : 20000);
}

  if (fn === "stream_request_test") { if (state.requests.some(q => q.status === "pending" || q.status === "running")) throw new Error("A test is already waiting or running");
    state.requests.unshift({ id: Date.now(), source_key: a.p_source_key, mode: a.p_mode, status: "pending", requested_by: "demo@example.org", requested_at: new Date().toISOString(), test_key: `${ymd(new Date())}_Test${a.p_source_key.slice(11)}` }); return 1; }
  if (fn === "stream_cancel_request") { const q = state.requests.find(x => x.id === a.p_id); if (q) q.status = "cancelled"; return; }
  if (fn === "stream_admin_add_user") { const e = a.p_email.toLowerCase(); const u = state.users.find(x => x.email === e);
    if (u) { u.note = a.p_note || u.note; u.is_admin = !!a.p_admin; } else state.users.push({ email: e, note: a.p_note, is_admin: !!a.p_admin, added_at: new Date().toISOString(), added_by: "demo" }); return; }
  if (fn === "stream_set_hymn_rights") { return; }
  if (fn === "stream_admin_remove_user") { if (a.p_email === "russ.koehl@morrisnorth.org") throw new Error("You cannot remove yourself"); state.users = state.users.filter(x => x.email !== a.p_email); return; }
}

// ------------------------------------------------------------------ start
async function boot() {
  if (demo) { state.user = { email: "russ.koehl@morrisnorth.org" }; state.admin = true; $("#who").textContent = "demo"; await refresh(); return; }
  const cfg = window.STREAM_CONFIG;
  if (!cfg || !window.supabase) { screen(el("div", { class: "center" }, el("h2", {}, "Configuration missing"), el("p", {}, "config.js or the Supabase library did not load."))); return; }
  state.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);   // same defaults as the HVAC page
  $("#signout").onclick = () => state.sb.auth.signOut();
  const onSession = async (session) => {
    state.user = session?.user || null;
    $("#signout").style.display = state.user ? "" : "none";
    $("#who").textContent = state.user ? (state.user.email || "") : "";
    clearTimeout(state.timer);
    if (!state.user) { showLogin(); return; }
    const me = String(state.user.email || "").toLowerCase();
    const { data, error } = await state.sb.from("stream_allowed_users").select("email,is_admin");
    const mine = !error && (data || []).find(r => String(r.email).toLowerCase() === me);
    if (!mine) { showNotAllowed(state.user.email); return; }
    state.admin = !!mine.is_admin;
    screen(el("p", { class: "hint", style: "text-align:center;margin-top:20vh" }, "Loading…"));
    await refresh();
  };
  const hash = location.hash || "";
  if (/error=/.test(hash)) {
    const q = new URLSearchParams(hash.slice(1));
    history.replaceState(null, "", location.pathname);
    showLogin("Sign-in problem: " + (q.get("error_description") || q.get("error") || "unknown") + ". Please try again.");
    return;
  }
  const { data: { session } } = await state.sb.auth.getSession();
  await onSession(session);
  state.sb.auth.onAuthStateChange((event, s) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") onSession(s); });
}
boot();
})();
</script>
