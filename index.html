<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morris North Stream</title>
<link rel="icon" href="data:,">
<style>
  /* Same look as the HVAC page (hvac.morrisnorth.org) */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
    --s1:#2a78d6; --s2:#eb6834; --band: rgba(42,120,214,0.10); --both-bg: rgba(132,94,247,.08); --zero-bg: rgba(245,190,20,.24);
    --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;   /* hymnal colors (HYMNAL_COLORS) */
    --good:#0b8a0b; --warning:#b97c00; --critical:#c62f2f; --wait:#898781;
    --goodbg: rgba(12,163,12,.09); --warnbg: rgba(250,178,25,.14); --badbg: rgba(208,59,59,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
      --s1:#3987e5; --s2:#d95926; --band: rgba(57,135,229,.14); --both-bg: rgba(167,139,250,.12); --zero-bg: rgba(250,204,21,.20);
      --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
      --good:#2fbf4f; --warning:#e0a12a; --critical:#ef6a6a;
      --goodbg: rgba(47,191,79,.12); --warnbg: rgba(224,161,42,.14); --badbg: rgba(239,106,106,.12);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --s1:#3987e5; --s2:#d95926; --band: rgba(57,135,229,.14); --both-bg: rgba(167,139,250,.12); --zero-bg: rgba(250,204,21,.20);
    --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
    --good:#2fbf4f; --warning:#e0a12a; --critical:#ef6a6a;
    --goodbg: rgba(47,191,79,.12); --warnbg: rgba(224,161,42,.14); --badbg: rgba(239,106,106,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; border: 1px solid var(--border); color: var(--ink-2); }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--good); } .pill.warn .dot { background: var(--warning); } .pill.bad .dot { background: var(--critical); }
  /* the tab row stays at the top of the window once the page scrolls up to it (Russ, 2026-11-18) */
  nav.tabs { display:flex; gap: 4px; padding: 8px 16px 0; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;
    position: sticky; top: 0; z-index: 30; }
  nav.tabs::-webkit-scrollbar { display: none; }   /* ten tabs for admins: a narrow window swipes the tab row, never the page */
  nav.tabs button { border: 1px solid transparent; border-bottom: none; background: none; border-radius: 10px 10px 0 0; padding: 8px 16px; font-size: 15px; color: var(--ink-2); }
  nav.tabs button.on { background: var(--page); border-color: var(--border); color: var(--ink); font-weight: 650; margin-bottom: -1px; }
  nav.tabs button .live { display:inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--s1); margin-left: 6px; vertical-align: middle; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  button, input[type=text], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  button { cursor: pointer; touch-action: manipulation; } button:hover { background: var(--hover); } button:disabled { opacity: .5; cursor: default; }
  button.google { display:inline-flex; align-items:center; gap:10px; padding: 10px 18px; font-weight: 600; font-size: 16px; }
  button.google svg { width: 20px; height: 20px; }
  button.big { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 12px; }
  button.manual { border: 2px solid var(--warning); color: var(--warning); }
  button.auto { border: 2px solid var(--good); color: var(--good); }
  button.stop { border: 2px solid var(--critical); color: var(--critical); }   /* "Stop the stream now" (2026-11-15) */
  button.yes.stop { background: var(--critical); color: #fff; }
  .confirm.stop { border-color: var(--critical); background: var(--badbg); }
  .banner.stop { border-color: var(--critical); background: var(--badbg); }
  button.yes { background: var(--warning); border-color: transparent; color: #fff; }
  button.primary { background: var(--s1); color: #fff; border-color: transparent; font-weight: 600; }
  button.small { padding: 3px 10px; font-size: 13px; } button.danger { color: var(--critical); }
  main { padding: 16px; max-width: 980px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; }   /* tall enough to keep the tab row at the top */
  main.narrow { max-width: 760px; }
  .hint { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .card > h2 { font-size: 13px; margin: 0 0 10px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 10px; }
  .cardhead > h2 { font-size: 13px; margin: 0; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .cardhead > a { font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; } .cardhead > a:hover { text-decoration: underline; }
  .card.test { border: 2px dashed var(--s1); }
  .runhead { display:flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .runhead h3 { margin: 0; font-size: 20px; line-height: 1.2; } .runhead .when { color: var(--muted); font-size: 13px; }
  .badge { display:inline-flex; align-items:center; gap:6px; font-size: 13px; font-weight: 650; padding: 4px 11px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.ok { color: var(--good); border-color: var(--good); background: var(--goodbg); }
  .badge.warning { color: var(--warning); border-color: var(--warning); background: var(--warnbg); }
  .badge.failed { color: var(--critical); border-color: var(--critical); background: var(--badbg); }
  .badge.running { color: var(--s1); border-color: var(--s1); background: var(--band); }
  .badge.skipped { color: var(--warning); border-color: var(--warning); }
  .badge.small { font-size: 12px; padding: 2px 9px; }
  ol.steps { list-style: none; margin: 14px 0 0; padding: 0; }
  ol.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
  ol.steps li:first-child { border-top: none; }
  .num { width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 14px;
         border: 2px solid var(--wait); color: var(--wait); background: var(--surface); font-variant-numeric: tabular-nums; }
  li.ok .num { background: var(--good); border-color: var(--good); color: #fff; }
  li.warning .num { background: var(--warning); border-color: var(--warning); color: #fff; }
  li.failed .num { background: var(--critical); border-color: var(--critical); color: #fff; }
  li.running .num { border-color: var(--s1); color: var(--s1); animation: pulse 1.4s ease-in-out infinite; }
  li.skipped .num { border-style: dashed; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--band); } }
  .stepline { display:flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .stepline b { font-weight: 650; }
  .stat { font-size: 13px; font-weight: 650; white-space: nowrap; }
  li.ok .stat { color: var(--good); } li.warning .stat { color: var(--warning); } li.failed .stat { color: var(--critical); }
  li.running .stat { color: var(--s1); } li.pending .stat, li.skipped .stat { color: var(--muted); }
  .detail { font-size: 14px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
  li.failed .detail { color: var(--ink); background: var(--badbg); border-left: 3px solid var(--critical); padding: 6px 9px; border-radius: 6px; margin-top: 5px; }
  li.failed .detail::before { content: "Why: "; font-weight: 650; color: var(--critical); }
  li.warning .detail { border-left: 3px solid var(--warning); padding-left: 9px; }
  li.pending .detail, li.skipped .detail { color: var(--muted); }
  a { color: var(--s1); }
  .banner { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--warning); background: var(--warnbg); font-size: 14px; }
  .banner.info { border-color: var(--s1); background: var(--band); }
  .banner.bad { border-color: var(--critical); background: var(--badbg); }
  /* live in church (top of the Now tab) */
  .card.live { border: 2px solid var(--s1); }
  .live .tag { font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--s1); }
  .live .tag::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--critical); margin-right: 7px; animation: pulse 1.4s ease-in-out infinite; }
  .live .now { font-size: 22px; font-weight: 700; margin: 6px 0 4px; line-height: 1.25; }
  .live .now .what { display: block; font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .live .off { color: var(--muted); font-weight: 600; } .live .now.off { font-size: 17px; }
  .live .sub { color: var(--ink-2); font-size: 14px; font-weight: 400; margin-top: 3px; }
  .live .lbl { margin-top: 8px; }
  .livebox { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--surface); }
  .livebox .tag { font-size: 12px; } .livebox .tag::before { display: none; }
  .live .hymncols { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(var(--rows, 1), auto); grid-auto-flow: column; gap: 2px 24px; font-size: 14px; color: var(--ink-2); }
  .live .minlines, .live .hymnlist { font-size: 14px; color: var(--ink-2); }
  .live .minlines strong { font-weight: 650; color: var(--ink); }
  .live .minread { padding-left: 22px; }
  .live .livetop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 18px; flex-wrap: wrap; }
  .live .livetop .readings { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
  .live .livetop table.counts { margin-top: 8px; }
  /* the live video: about twice the counts table (Russ, 2026-11-22); the player is #liveVideo on <body>, over the slot */
  .live .livevideo { width: min(384px, 100%); aspect-ratio: 16 / 9; margin: 12px 0 4px; border-radius: 8px; background: #000;
    display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 14px; }
  .live .livevidrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; margin: 12px 0 4px; }
  .live .livevidrow .livevideo { margin: 0; }
  .live .livevidrow table.counts { margin-left: auto; }
  #liveVideo { position: absolute; z-index: 5; border-radius: 8px; overflow: hidden; background: #000; }
  #liveVideo iframe { width: 100%; height: 100%; border: 0; display: block; }
  #liveVideo .lvsound { position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; font-size: 18px; line-height: 1.3;
    background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; cursor: pointer; }
  @media (max-width: 560px) { .live .hymncols { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; } }
  .live .livefoot { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 15px; }
  .live .readings strong { font-weight: 650; }
  .live table.counts { width: auto; margin-left: auto; border: 1px solid var(--border); border-radius: 8px; border-collapse: separate; border-spacing: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .live table.counts th, .live table.counts td { padding: 3px 12px; text-align: right; }
  .live table.counts th { text-transform: none; letter-spacing: 0; font-size: 14px; background: none; }
  .live table.counts thead th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  .live table.counts tbody th { text-align: left; font-weight: 600; color: var(--ink-2); }
  .live table.counts td { font-weight: 700; color: var(--ink); }
  .live table.counts tr.tot th, .live table.counts tr.tot td { border-top: 1px solid var(--border); }
  .ctl { margin-top: 14px; }
  .confirm { margin-top: 10px; padding: 12px; border: 1px solid var(--warning); border-radius: 12px; background: var(--warnbg); font-size: 14px; }
  .confirm p { margin: 0 0 10px; } .confirm p.sure { font-size: 16px; font-weight: 700; margin-bottom: 4px; }   /* Russ, 2026-11-10 */
  .confirm .row { display:flex; gap: 8px; } .confirm .row button { flex: 1; padding: 11px; font-weight: 600; }
  .confirm input[type=text] { width: 100%; margin-bottom: 10px; font-size: 16px; padding: 8px 10px; }
  .msg { font-size: 14px; margin-top: 8px; } .msg.bad { color: var(--critical); } .msg.ok { color: var(--good); }
  .next { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--grid); }
  .next:first-of-type { border-top: none; }
  .next .what b { display:block; } .next .what span { color: var(--muted); font-size: 13px; }
  .next .mode { grid-column: 1 / -1; font-size: 14px; font-weight: 650; text-align: center; padding: 7px; border-radius: 10px; }
  .next .mode.auto { color: var(--good); background: var(--goodbg); } .next .mode.manual { color: var(--warning); background: var(--warnbg); }
  .next .who { grid-column: 1 / -1; font-size: 13px; color: var(--warning); margin-top: -2px; }
  .next > button { padding: 3px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; } .next .confirm { grid-column: 1 / -1; margin-top: 0; }
  /* History table: every heading sorts, a row opens to its steps and hymns */
  .tablewrap { overflow-x: auto; }
  /* headings stay at the top of the window while the rows scroll (Viewers); a scrolling box would stop that, and
     that table fits without sideways scrolling */
  .tablewrap.sticky { overflow: visible; }
  .tablewrap.sticky th { position: sticky; top: var(--navh, 0px); z-index: 1; background: var(--surface); box-shadow: inset 0 -1px 0 var(--grid); }
  .tablewrap.sticky th.both-col { background: linear-gradient(var(--both-bg), var(--both-bg)), var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  th.wrap { white-space: normal; }
  th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--ink); text-decoration: underline; }
  th[data-dir="asc"]::after { content: " \25B2"; font-size: 9px; } th[data-dir="desc"]::after { content: " \25BC"; font-size: 9px; }
  table.hist tbody tr.row { cursor: pointer; } table.hist tbody tr.row:hover td { background: var(--hover); }
  table.hist tr.row.open td { background: var(--band); border-bottom-color: transparent; }
  table.hist td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.hist td.date .tw { display:inline-block; width: 14px; color: var(--muted); }
  table.hist td.res { white-space: nowrap; }
  table.hist td.res small { display:block; color: var(--muted); font-size: 11px; margin-top: 3px; white-space: normal; }
  table.hist .pf { display:inline-block; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 6px; color: #fff; letter-spacing: .03em; }
  .pf.pass { background: var(--good); } .pf.fail { background: var(--critical); } .pf.run { background: var(--s1); } .pf.hand { background: var(--warning); }
  table.hist td.readings { min-width: 150px; }
  table.hist .ctr, table.hist th.ctr { text-align: center; font-variant-numeric: tabular-nums; }
  /* Announcements tab (2026-11-22) */
  .ann .annhead { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
  .ann .annhead h3 { margin: 0; font-size: 18px; }
  .ann .annview { margin-left: auto; display: flex; gap: 4px; }
  .ann .annview button.on { background: var(--s1); color: #fff; border-color: var(--s1); }
  .ann h4 { margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
  .ann ul { margin: 0; padding-left: 20px; } .ann li { margin: 3px 0; }
  .ann .anntag { margin-left: 8px; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
  .ann .annfoot { margin: 12px 0 0; }
  .calreq textarea.praybox { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; line-height: 1.4; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }
  .calreq .calbox { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  .calreq .calwords { margin: 0; font-size: 14px; }
  .calreq .calqs { margin: 4px 0 8px; padding-left: 20px; font-size: 13px; color: var(--ink-2); }
  .calreq .calscroll { overflow-x: auto; }
  .calreq table.calops { border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .calreq table.calops th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 2px 4px; }

  .calreq table.calops tr.calwhy td { color: var(--ink-2); font-size: 12px; padding-bottom: 6px; }
  .ann .praywrap textarea.praybox { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; line-height: 1.4; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }
  .ann details.annmail { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .ann details.annmail > summary { cursor: pointer; font-size: 14px; color: var(--ink-2); }
  .ann .mailbar { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .ann .mailbar .btnlink { display: inline-block; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; font-size: 13px; text-decoration: none; }
  .ann .mailprev { background: #fff; color: #111; border: 1px solid var(--border); border-radius: 8px; padding: 18px 22px; max-width: 760px; overflow-x: auto; }
  .ann .mailprev[contenteditable="true"] { outline: 2px solid var(--s1); outline-offset: 2px; }
  table.hist .svc-under { display: none; color: var(--ink-2); font-size: 12px; margin-left: 14px; }
  table.hist tr.detailrow > td { background: var(--page); padding: 6px 12px 16px; }
  .two { display:grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
  .stack { max-width: 860px; } .stack h4 + ol.steps { margin-top: 4px; } .stack .facts { margin-bottom: 4px; }
  .two h4, .stack h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
  table.hymns { font-size: 13px; } table.hymns td, table.hymns th { padding: 4px 6px; }
  table.hymns td.n { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.hymns td.how { color: var(--muted); font-size: 12px; }
  .facts { font-size: 14px; display:grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin-top: 6px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .testform { display:grid; gap: 10px; }
  .testform label.opt { display:flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .testform label.opt.on { border-color: var(--s1); background: var(--band); }
  .testform label.opt input { margin-top: 4px; } .testform label.opt b { display:block; } .testform label.opt span { font-size: 13px; color: var(--ink-2); }

const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); if (s < 90) return "just now"; const m = Math.round(s / 60); if (m < 90) return `${m} min ago`;
  const h = Math.round(m / 60); return h < 36 ? `${h} h ago` : `${Math.round(h / 24)} days ago`; };

  while ((m = re.exec(text))) { out.append(text.slice(last, m.index), el("a", { href: m[0], target: "_blank", rel: "noopener" }, m[0])); last = m.index + m[0].length; }

const serviceOf = (id) => (state.schedule?.services || []).find(s => s.id === id || "Test" + s.id === id) || null;

// The whole run in one word, from its steps.
function overall(run) {
  const st = (run.steps || []).map(s => s.status);
  const has = (x) => st.includes(x);
  if (has("skipped") && st.every(x => x === "skipped" || x === "pending")) return { cls: "skipped", text: "Run by hand" };
  if (has("running")) return { cls: "running", text: "In progress" };
  if (has("failed")) return { cls: "failed", text: "Failed" };
  const started = st.some(x => x !== "pending");
  const finished = stepOf(run, "report").status === "ok" || st.every(x => x !== "pending");
  if (started && !finished) {
    if (run.is_test) return { cls: "running", text: "In progress" };
    const svc = serviceOf(run.service_id); const day = parseYmd(run.run_date);
    const late = svc ? atTime(day, svc.cutoff).getTime() + 3 * 3600e3 : day.getTime() + 30 * 3600e3;
    return Date.now() < late ? { cls: "running", text: "In progress" } : { cls: "warning", text: "Not finished" };
  }
  if (has("skipped")) return { cls: "skipped", text: "Partly by hand" };
  if (has("warning")) return { cls: "warning", text: "Done, with warnings" };
  return { cls: "ok", text: "Successful" };
}
// History: PASS = the sermon is on (Vimeo and AC Central done); FAIL = it is not, or a step failed on the way.
function passFail(run) {
  const o = overall(run);
  if (o.cls === "running") return { cls: "run", text: "RUNNING", rank: 1 };
  if (o.cls === "skipped") return { cls: "hand", text: "BY HAND", rank: 2 };
  const on = stepOf(run, "vimeo").status === "ok" && stepOf(run, "accentral").status === "ok";
  return on ? { cls: "pass", text: "PASS", rank: 3 } : { cls: "fail", text: "FAIL", rank: 0 };
}
function problems(run) {
  const f = (run.steps || []).filter(s => s.status === "failed").map(s => s.label);
  const w = (run.steps || []).filter(s => s.status === "warning").map(s => s.label);
  const out = [];
  if (f.length) out.push(`${f.length} failed: ${f.join(", ")}`);
  if (w.length) out.push(`${w.length} warning${w.length > 1 ? "s" : ""}`);
  return out.join("; ");
}

// Scheduled services in the next weeks (same rule as the PC: weekday, and weeks of the month when given).
function upcoming(count = 5) {
  const out = []; const now = new Date();
  for (let i = 0; i < 45 && out.length < count; i++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    for (const s of (state.schedule?.services || [])) {
      if (!s.enabled) continue;
      // one-off dates count whatever the week (schedule.json extraDates, e.g. Thanksgiving Eve 2026-11-25)
      if (!(s.extraDates || []).includes(ymd(day))) {
        if (!(s.days || []).includes(DAY[day.getDay()])) continue;
        if (s.weeksOfMonth && !s.weeksOfMonth.includes(Math.floor((day.getDate() - 1) / 7) + 1)) continue;
      }
      const end = atTime(day, s.cutoff);
      if (end < now) continue;
      out.push({ key: `${ymd(day)}_${s.id}`, svc: s, day, start: atTime(day, s.start), end });
    }
  }
  return out.sort((a, b) => a.start - b.start).slice(0, count);
}
const anyActive = () => [...state.runs, ...state.tests].some(r => overall(r).cls === "running") || state.requests.some(q => q.status === "pending" || q.status === "running");

async function load() {

  const [runs, tests, ctl, meta, req, stopReq] = await Promise.all([
    sb.from("stream_runs").select(cols).eq("is_test", false).order("run_date", { ascending: false }).order("run_key", { ascending: false }).limit(200),
    sb.from("stream_runs").select(cols).eq("is_test", true).order("updated_at", { ascending: false }).limit(10),
    sb.from("stream_control").select("run_key,note,set_by,set_at"),

    sb.from("stream_requests").select("*").order("id", { ascending: false }).limit(10),

  ]);
  for (const r of [runs, tests, ctl, meta, req]) if (r.error) throw new Error(r.error.message);
  state.runs = runs.data || []; state.tests = tests.data || []; state.requests = req.data || [];

function stopControl(run) {

  const last = (state.stops || []).find(q => q.run_key === key);
  const at = (q) => fmtTime(new Date(q.requested_at));

  } else if (last && last.status === "done") {

      `Asked by ${last.requested_by} at ${at(last)}${last.note ? `. ${last.note}` : ""}. Step 6 turns done when the recording has finished writing.`));
  } else if (state.askingStop === key) {
    box.append(el("div", { class: "confirm stop" }, el("p", { class: "sure" }, "Is the service over?"),
      el("p", {}, "The live video and the radio audio end now for everyone watching or listening, and the recording stops. This cannot be undone. Then the church PC finds the minister, readings and hymns, trims the recording, uploads it to Vimeo and enters it on AC Central (steps 7 to 12)."),
      el("div", { class: "row" },

      : `Otherwise the PC stops it at ${cut}.`));
  }
  if (state.stopMsg && state.stopMsg.key === key) box.append(el("div", { class: "msg " + (state.stopMsg.ok ? "ok" : "bad") }, state.stopMsg.text));
  return box;

    el("div", { class: "stepline" }, el("span", { class: "tag" }, "Live in church"),

  let now;

  else now = el("div", { class: "now off" }, "Quiet");
  card.append(now);
  const hy = (L.hymns || []).filter(h => h.number);
  const la = L.lastAnnounced;
  if (la && la.number && L.state !== "singing" && !hy.some(h => String(h.number) === String(la.number) && h.time >= la.time))
    card.append(el("div", { class: "sub" }, `Announced at ${la.time}: #${la.number} ${la.title || ""}${la.hymnal ? " · " + bookName(la) : ""}`));
  const V = state.watching;
  card.append(...liveDetails(L, V && V.active && V.run_key === L.run_key ? V : null, false));
  return card;
}

// What the PC heard live and how many watched, under step 7 once the service is over (Russ, 2026-11-18: "the items
// from the new card, hymns, ministers, viewers, etc in the box under step #7"). From the run's own summary.live
// (Get-MnRunSummary: data\live\<run>-live.json + -viewers-end.json, written when the service ends), or, right after
// the service and before the run is pushed again, from stream_meta 'live' / 'viewers' for the same run.
function liveSummaryBox(run) {
  let L = run.summary?.live || null, V = L ? L.viewers : null;
  // the run's own summary first (it holds corrections, 2026-11-19); stream_meta only until the run has it
  if (!L && state.live && state.live.run_key === run.run_key && !state.live.active) {
    L = state.live;
    V = state.watching && state.watching.run_key === run.run_key ? state.watching : V;
  }
  // readings: the after-service analysis (what went to AC Central, with start times) when the run has it, else what
  // the live listener found (Russ, 2026-11-19: books, chapters and verses under the ministers in this box)
  const RS = (run.summary?.readingSpans || []).filter(r => r && r.book);
  if (!L && !V) return null;
  if (RS.length) L = { ...(L || {}), readings: RS };
  const kids = liveDetails(L || {}, V, true);
  if (!kids.length) return null;
  return el("div", { class: "live livebox" }, ...kids);
}

// hymns (two columns), ministers (one per line, first - last heard), readings (bottom left) and the counts box
// (bottom right). ended = the service is over: counts are the last reading, not checked for freshness.
// Under step 7 each hymn shows its book instead of the time (Russ, 2026-11-19: "remove the 19:18 replace with the
// name of the hymn book. Some will be Tabernacle Hymns"). The combined Hymns of Zion book continues into the
// Tabernacle hymns from 303 on, so those say Tabernacle Hymns, with the number as it stands in the book.
// 2026-11-22 (Russ: "Yes, Tabernacle Hymns"): the whole combined book is called Tabernacle Hymns at Morris North, so
// its first part (Hymns of Zion 1-302, e.g. #99 The Solid Rock) says Tabernacle Hymns too. Only the label: the data,
// the sheet and the copyright list keep the hymnal name "Hymns of Zion".
const bookName = (h) => {
  return h && h.hymnal === "Hymns of Zion" ? "Tabernacle Hymns" : ((h && h.hymnal) || "");
};
function liveDetails(L, V, ended) {
  const out = [];
  // a hymn is sung only once in a service (Russ, 2026-11-22: "We would only sing a hymn one time"): the live listener
  // listed #99 at 10:01, 10:02 and 10:03 (pauses in the singing); only the first is kept
  const hy = [];
  for (const h of (L.hymns || []).filter(h => h && h.number).sort((a, b) => String(a.time || "").localeCompare(String(b.time || ""))))
    if (!hy.some(x => (String(x.number) === String(h.number) && (x.hymnal || "") === (h.hymnal || "")) || (x.title && x.title === h.title))) hy.push(h);
  // Russ, 2026-11-18: hymns in two columns, each minister on a line of his own with from - to, the counts in a box
  // (Video / Audio / Total down the side, Current / Max across). 2026-11-19: ministers first with the counts to their
  // right at the top, the hymns below; only the minister names bold.
  // one line per minister with the minutes his voice was heard in all (Russ, 2026-11-19: "Damon Knobloch - xx ...
  // the total mins"); each heard stretch counts from its first to its last 10-s reading, plus that last reading
  const hms = (t) => { const p = String(t).split(":").map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] || 0); };
  const mins = [];
  for (const s of L.speakers || []) {
    if (!s.name || s.name === "UNKNOWN") continue;
    const sec = Math.max(0, hms(s.to) - hms(s.from)) + 10;
    const m = mins.find(x => x.name === s.name);
    if (m) m.sec += sec; else mins.push({ name: s.name, sec });
  }
  // Bible readings (analyze\live.py, the after-service finder on the words spoken), each indented under the minister
  // whose voice was heard when it began (Russ, 2026-11-18); one nobody is matched to stays at the bottom left.
  const named = (L.speakers || []).filter(s => s.name && s.name !== "UNKNOWN");
  const secs = (t) => { const p = String(t).split(":").map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] || 0); };
  const readerOf = (r) => {
    if (!r.time || !named.length) return null;
    const t = secs(r.time) + 30;   // "HH:MM" of the reading's start: the middle of that minute
    const inSpan = named.find(s => secs(s.from) <= t && t <= secs(s.to));
    if (inSpan) return inSpan.name;
    let best = null, gap = 181;    // else the minister heard closest to it, within 3 minutes
    for (const s of named) { const g = Math.min(Math.abs(secs(s.from) - t), Math.abs(secs(s.to) - t)); if (g < gap) { gap = g; best = s.name; } }
    return best;
  };
  const reads = (L.readings || []).filter(Boolean).map(r => ({ text: `${r.book} ${r.chapter}:${r.v0}${r.v1 && r.v1 !== r.v0 ? "-" + r.v1 : ""}`, who: readerOf(r) }));
  const left = [];
  // under step 7 no "Ministers:" / "Hymns:" labels (Russ, 2026-11-19: "we already know that")
  if (mins.length) left.push(ended ? null : el("div", { class: "sub lbl" }, "Ministers:"),
    el("div", { class: "minlines" }, ...mins.map(m => el("div", {}, el("strong", {}, m.name), ` - ${Math.max(1, Math.round(m.sec / 60))} min`,
      ...reads.filter(x => x.who === m.name).map(x => el("div", { class: "minread" }, x.text))))));
  // readings no minister is matched to: below the ministers
  const rd = reads.filter(x => !x.who || !mins.some(m => m.name === x.who)).map(x => x.text);
  if (rd.length) left.push(el("div", { class: "readings" }, rd.join(" · ")));
  // top right: people watching (Vimeo) and listening (Radio Mast), read once a minute (Watch-Viewers.ps1).
  // Total = both in both columns (its Max = Video Max + Audio Max).
  let counts = null;
  if (V) {
    // ended: services before the live listener (rebuilt 2026-11-19) have only the Max, no Final reading
    const fresh = (x) => x && (ended ? x.current != null || x.peak != null : x.at && (Date.now() - new Date(x.at)) / 1000 < 300);
    const v = fresh(V.video) ? V.video : null, a = fresh(V.audio) ? V.audio : null;
    // Total = Video + Audio in both columns (Russ, 2026-11-18: "Add the total for max 4 + 10 = 14")
    const t = v && a ? { current: v.current != null && a.current != null ? v.current + a.current : null, peak: v.peak != null && a.peak != null ? v.peak + a.peak : null } : null;
    if (v || a) {
      const row = (name, x, cls) => el("tr", cls ? { class: cls } : {}, el("th", {}, name),
        el("td", {}, x && x.current != null ? String(x.current) : "–"), el("td", {}, x && x.peak != null ? String(x.peak) : "–"));
      // after the service "Current" is the last reading, taken as the stream stopped
      counts = el("table", { class: "counts" },
        el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, ended ? "Final" : "Current"), el("th", {}, "Max"))),
        el("tbody", {}, row("Video", v), row("Audio", a), row("Total", t, "tot")));
    }
  }
  // the live video between the ministers and the hymns (Russ, 2026-11-22), only while the service runs: a place
  // holder here, the player itself lives outside the page part that is rebuilt every 5 s (liveVideoSync).
  // With the video the counts sit to its right, bottoms lined up (Russ: "so the bottom of the viewer table is aligned
  // with the bottom of the video"); without it they stay at the top right, next to the ministers.
  const video = !ended && L.video;
  if (left.length || (counts && !video)) out.push(el("div", { class: "livetop" }, el("div", { class: "liveleft" }, ...left), (!video && counts) || el("span", {})));
  if (video) out.push(el("div", { class: "livevidrow" },
    el("div", { class: "livevideo", id: "liveVideoSlot", "data-src": L.video, "data-run": L.run_key || "" },
      demo && !params.get("video") ? el("span", {}, "Live video") : null),
    counts));
  if (hy.length) out.push(ended ? null : el("div", { class: "sub lbl" }, "Hymns so far:"),
    // under step 7 one column, oldest first, "Hymns of Zion - #291 - O For a Thousand Tongues" (Russ, 2026-11-19)
    ended ? el("div", { class: "hymnlist" }, ...hy.map(h => el("div", {}, [bookName(h), `#${h.number}`, h.title].filter(Boolean).join(" - "))))
      // the live card: one column too, with the time first (Russ, 2026-11-22: "12:22 - #432 Sound the Battle Cry, make
      // it in a single column, format like this Tabernacle Hymns - #99 - The Solid Rock")
      : el("div", { class: "hymnlist" }, ...hy.map(h => el("div", {}, [h.time, bookName(h), `#${h.number}`, h.title].filter(Boolean).join(" - ")))));
  return out;
}

// ------------------------------------------------------------------ Sanctuary mixer (Russ, 2026-11-15: "add the muting
// to the Now tab, so we know what is happening and when"). From stream_meta 'mixer' (Invoke-MixerSchedule.ps1).
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function mixerCard() {
  const M = state.mixer;
  if (!M || !M.enabled) return null;
  const now = new Date(), todayName = WEEKDAYS[now.getDay()];
  const w = M.walkoff || {};
  const days = [...new Set([...(M.steps || []).map(s => s.day), w.day].filter(Boolean))];
  const isToday = days.includes(todayName);
  const fresh = M.date === ymd(now);   // results belong to today
  const atToday = hm => { const [h, m] = String(hm).split(":").map(Number); const d = new Date(now); d.setHours(h, m, 0, 0); return d; };
  const rows = (M.steps || []).map(s => ({ time: s.time, label: s.label, kind: "step", s }));
  if (w.from) rows.push({ time: w.from, label: `${M.bus || "AUXILIARY"} muted ${w.emptyMin || 5} minutes after the ministers walk off the platform (${fmtTime(atToday(w.latest || "11:45"))} at the latest)`, kind: "walk" });
  rows.sort((a, b) => a.time < b.time ? -1 : 1);
  const ol = el("ol", { class: "steps" });
  const fixed = rows.filter(x => x.kind === "step");
  for (const r of rows) {
    let cls = "pending", stat = `at ${fmtTime(atToday(r.time))}`, detail = null;
    if (r.kind === "step") {
      const s = isToday && fresh ? r.s : {};
      const nx = fixed[fixed.indexOf(r) + 1];
      const windowEnd = nx ? atToday(nx.time) : new Date(atToday(r.time).getTime() + 3600e3);   // as Invoke-MixerSchedule.ps1
      if (s.status === "done") { cls = "ok"; stat = `Done · ${fmtTime(new Date(s.at))}`; detail = s.detail; }
      else if (s.status === "failed") { cls = "failed"; stat = `Not done · ${fmtTime(new Date(s.at))}`; detail = s.detail + (windowEnd > now ? " The PC tries again every minute." : ""); }
      else if (isToday && atToday(r.time) <= now && windowEnd > now) { cls = "running"; stat = "Due now"; }
      else if (isToday && windowEnd <= now) { cls = "warning"; stat = "No result"; detail = "The church PC did not report this step (was it off?)."; }
    } else if (isToday && fresh && w.status) {
      const es = w.emptySince ? new Date(w.emptySince) : null, mu = w.mutedAt ? new Date(w.mutedAt) : null;
      if (w.status === "muted") { cls = "ok"; stat = `Muted · ${fmtTime(mu)}`; detail = es ? `The platform was empty from ${fmtTime(es)}.` : w.detail; }
      else if (w.status === "muted (fallback)") { cls = "warning"; stat = `Muted · ${fmtTime(mu)}`; detail = "The camera did not see the ministers leave, so it was muted at the latest time."; }
      else if (w.status === "failed") { cls = "failed"; stat = "Not muted"; detail = (w.detail || "") + " Mute AUXILIARY by hand."; }
      else if (w.status === "gave up") { cls = "warning"; stat = "Stopped watching"; detail = w.detail; }
      else if (es) { cls = "running"; stat = `Mutes at ${fmtTime(new Date(es.getTime() + (w.emptyMin || 5) * 60000))}`; detail = `The platform has been empty since ${fmtTime(es)}.`; }
      else { cls = "running"; stat = "Watching the platform"; detail = w.occupiedSeen ? "The ministers are on the platform." : "Waiting to see the ministers on the platform."; }
    } else if (r.kind === "walk" && isToday && atToday(r.time) <= now && atToday(w.latest || "11:45") > now) { cls = "running"; stat = "Watching the platform"; }
    ol.append(el("li", { class: cls },
      el("div", { class: "num", "aria-hidden": "true" }, cls === "ok" ? "✓" : cls === "failed" ? "✕" : cls === "warning" ? "!" : "•"),
      el("div", {}, el("div", { class: "stepline" }, el("b", {}, `${fmtTime(atToday(r.time))} · ${r.label}`), el("span", { class: "stat" }, stat)),
        detail ? el("div", { class: "detail" }, detail) : null)));
  }
  const H = M.health || {};
  let hl;
  if (H.ok === false) hl = el("div", { class: "banner bad" }, el("b", {}, "The mixer is not answering. "), `${H.detail || ""}. Restart the mixer; the PC checks again every 2 minutes.`);
  else if (H.ok && H.at) hl = el("p", { class: "hint", style: "margin:8px 0 0" }, `Mixer answering at ${M.host} · checked ${fmtTime(new Date(H.at))}` +
    (H.db !== null && H.db !== undefined ? ` · ${M.bus} ${H.db > 0 ? "+" : ""}${H.db} dB, ${H.muted ? "muted" : "unmuted"}` : ""));
  else hl = el("p", { class: "hint", style: "margin:8px 0 0" }, `The PC checks the mixer (${M.host}) every 2 minutes on ${(H.days || ["Sunday"]).join(", ")}s from ${fmtTime(atToday(H.from || "09:30"))}, and texts you if it stops answering.`);
  return el("section", { class: "card" }, el("h2", {}, `Sanctuary mixer · ${M.bus || "AUXILIARY"} · ${isToday ? "today" : "every " + days.join(", ")}`), hl, ol);
}

function renderNow() {
  const kids = [];
  const runs = state.runs;
  const lc = liveCard();
  if (lc) kids.push(lc);
  const current = runs.find(r => overall(r).cls === "running") || runs[0];
  if (current) kids.push(runCard(current, current.run_date === ymd(new Date()) && overall(current).cls === "running" ? "Now" : "Latest service"));
  else kids.push(el("section", { class: "card" }, el("h2", {}, "Latest service"), el("p", { class: "hint" }, "No service has reported yet.")));
  const mx = mixerCard();
  if (mx) kids.push(mx);
  const liveTest = state.tests.find(r => overall(r).cls === "running");
  if (liveTest && state.admin) kids.unshift(el("div", { class: "banner info", style: "margin:0 0 16px" }, el("b", {}, "A test is running: "), liveTest.service_name + ". ",
    el("a", { href: "#", onclick: (e) => { e.preventDefault(); state.tab = "tests"; store.set("tab", "tests"); render(); } }, "Watch it on the Tests tab")));

  const next = upcoming(5).filter(u => !runs.some(r => r.run_key === u.key && overall(r).cls === "running"));
  const nc = el("section", { class: "card" }, el("h2", {}, "Coming up"));
  if (!state.schedule) nc.append(el("p", { class: "hint" }, "The schedule appears after the church PC's next report."));
  for (const u of next) {
    const ctl = state.control.get(u.key);
    // small switch button top right, the mode as a wide line under it (Russ, 2026-11-10)
    const row = el("div", { class: "next" },
      el("div", { class: "what" }, el("b", {}, `${u.svc.name} · ${fmtShortDay(u.day)}`), el("span", {}, `${fmtTime(u.start)} to ${fmtTime(u.end)}`)));
    if (ctl) row.append(el("button", { class: "auto", disabled: state.busy, onclick: () => setManual(u.key, false) }, "Back to automatic"));
    else if (state.asking !== u.key) row.append(el("button", { class: "manual", disabled: state.busy, onclick: () => { state.asking = u.key; state.msg = null; render(); } }, "Run by hand"));
    row.append(el("div", { class: "mode " + (ctl ? "manual" : "auto") }, ctl ? "By hand" : "Automatic"));
    if (ctl) row.append(el("div", { class: "who" }, `Set by ${ctl.set_by} ${ago(new Date(ctl.set_at))}${ctl.note ? ` (${ctl.note})` : ""}`));
    if (state.asking === u.key) {
      const note = el("input", { type: "text", placeholder: "Reason (optional), e.g. wedding, special program" });
      row.append(el("div", { class: "confirm" }, el("p", { class: "sure" }, "Are you sure?"),
        el("p", {}, `The church PC will not start, check, stop, upload or enter ${u.svc.name} on ${fmtShortDay(u.day)}. Start and stop OBS and Rocket Broadcaster yourself.`), note,
        el("div", { class: "row" },
          el("button", { class: "yes", disabled: state.busy, onclick: () => setManual(u.key, true, note.value.trim()) }, "Yes, run it by hand"),
          el("button", { onclick: () => { state.asking = null; render(); } }, "Cancel"))));
    }
    if (state.msg && state.msg.key === u.key) row.append(el("div", { class: "msg " + (state.msg.ok ? "ok" : "bad"), style: "grid-column:1/-1" }, state.msg.text));
    nc.append(row);
  }
  kids.push(nc);
  kids.push(el("p", { class: "hint", style: "text-align:center" }, `Updated ${fmtTime(new Date())} · refreshes by itself`));
  screen(...kids);
}

// ------------------------------------------------------------------ Announcements (Russ, 2026-11-22: "At the end of a
// sermon, after we sing, pray, a minister will ask for greetings from other churches then read Announcements ... only
// for Sundays. At the end of last sermon PM, combine the Announcements between the AM & PM ... a list of all the
// unique greetings from other churches"). stream_announcements, one row per Sunday, written by the church PC after each
// service (scripts\Update-Announcements.ps1 -> analyze\announcements.py: the last minutes of the recording, read by
// Claude; church names from AC Central's congregation list). Loaded when the tab opens, again every 5 minutes.
async function loadAnn() {
  // demo + &calfile=<same-site json>: a test copy of the church calendar (local testing only)
  if (demo && params.get("calfile") && !state.cal) { try { state.cal = await (await fetch(params.get("calfile"), { cache: "no-store" })).json(); } catch {} }
  // demo + &churchfile=<same-site json>: a test copy of stream_meta 'churches' for the Greetings map (local testing only)
  if (demo && params.get("churchfile") && !state.churchMap) { try { state.churchMap = await (await fetch(params.get("churchfile"), { cache: "no-store" })).json(); } catch {} }
  if (demo) { state.ann = demoAnn(); state.annAt = Date.now(); return; }
  const base = "service_date,am,pm,combined,updated_at";
  let { data, error } = await state.sb.from("stream_announcements").select(base + ",prayers,prayers_carried,prayers_by,prayers_at,food,food_by,food_at")
    .order("service_date", { ascending: false }).limit(104);
  // until supabase\stream_status_8.sql has been run the prayer / food columns are missing: load without them, boxes wait
  state.noPrayers = !!(error && /prayers|food/i.test(error.message || ""));
  if (state.noPrayers) ({ data, error } = await state.sb.from("stream_announcements").select(base).order("service_date", { ascending: false }).limit(104));
  if (error) throw new Error(`stream_announcements: ${error.message}`);
  state.ann = data || []; state.annAt = Date.now();
}
// Prayer requests per Sunday (Russ, 2026-11-22: "Add previous prayer requests from the week before. Remove the date if
// it is past. Example. Week 1 - Pray for jim for his hip surgery on Nov 21. Week 2, pray for jim on his recent hip
// surgery"). One request per line, saved for everyone (stream_set_prayers, supabase\stream_status_8.sql). After a
// Sunday's service the church PC fills an empty list from the Sunday before, past dates reworded by Claude
// (Update-Announcements.ps1 -> announcements.py --carry-prayers); the weekly email's Prayer Requests use this list.
// Food for Thought works the same way (Russ, 2026-11-22: "Make these sections editable"): food / stream_set_food.
const SECTION_BOXES = {
  food: { title: "Food for Thought", rpc: "stream_set_food", rows: 4,
    placeholder: "A verse, a thought or a short story. Each line becomes one point in the email." },
  prayers: { title: "Prayer Requests", rpc: "stream_set_prayers", rows: 3, carried: "prayers_carried",
    placeholder: "One prayer request per line" },
};
function sectionBox(row, field) {
  const S = SECTION_BOXES[field];
  if (state.noPrayers) return el("p", { class: "muted small" }, `${S.title}: coming soon (the database part is not set up yet).`);
  const key = row.service_date;
  state.secDraft = state.secDraft || {};
  const dk = field + "." + key;
  const saved = Array.isArray(row[field]) ? row[field] : [];
  const ta = el("textarea", { class: "praybox", rows: String(Math.max(S.rows, saved.length + 1)), placeholder: S.placeholder });
  ta.value = dk in state.secDraft ? state.secDraft[dk] : saved.join("\n");
  const at = row[field + "_at"], by = row[field + "_by"];
  const msg = el("span", { class: "hint" },
    dk in state.secDraft ? "Not saved yet." :
    S.carried && row[S.carried] ? "Carried over from the Sunday before (dates that have passed reworded). Check, change and Save." :
    at ? `Saved ${fmtDate(new Date(at))} ${fmtTime(new Date(at))}${by ? " by " + by : ""}.` : "");
  ta.addEventListener("input", () => { state.secDraft[dk] = ta.value; msg.textContent = "Not saved yet."; });
  const save = el("button", { class: "small", onclick: async () => {
    const items = ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!demo) {
      save.disabled = true; msg.textContent = "Saving…";
      const { error } = await state.sb.rpc(S.rpc, { p_date: key, p_items: items });
      save.disabled = false;
      if (error) { msg.textContent = "Not saved: " + error.message; return; }
    }
    delete state.secDraft[dk];
    Object.assign(row, { [field]: items, [field + "_at"]: new Date().toISOString(), [field + "_by"]: demo ? "demo (not saved)" : (state.user && state.user.email) || "" },
      S.carried ? { [S.carried]: false } : {});
    render();
  } }, "Save");
  return el("div", { class: "praywrap" }, el("h4", {}, S.title), ta, el("div", { class: "mailbar" }, save, msg));
}

// Greetings tab (Russ, 2026-11-22: "Remove the Greetings from other churches ... from the announcements, put them in a
// new tab for now"; then "Include Wed ... Create a table at the top of a tally of only the churches where greetings
// were given. Time frame 2026, past 12 months, all time, custom. Under the table, show a map of the US of all churches,
// the total greetings from each church, 0 is fine"). A church counts once per day (AM and PM = 1, Russ 2026-11-22; a Wednesday 1).
// Church locations: stream_meta 'churches' (scripts\Update-ChurchMap.ps1). Map: d3 + us-atlas, loaded when shown.
async function loadMapLibs() {
  const add = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });

  if (p === "12m") { const a = new Date(t); a.setFullYear(y - 1); a.setDate(a.getDate() + 1); return { from: ymd(a), to: ymd(t) }; }

  }

// ------------------------------------------------------------------ refresh loop: every 5 s while something runs, else 20 s
async function refresh() {
  clearTimeout(state.timer);
  try {
    await load();
    // first move off a remembered tab this person may not see (the check boxes on the Admin tab), so its data loads
    const was = state.tab; renderTabs(); const moved = state.tab !== was;
    const statsTab = DATA_TABS.includes(state.tab);
    if (statsTab && (!state.sermons || Date.now() - state.statsAt > 10 * 60e3)) { await loadStats(); if (state.crEdit === null) render(); }
    if ((state.tab === "announcements" || state.tab === "greetings") && (!state.ann || Date.now() - state.annAt > 5 * 60e3)) await loadAnn();
    // do not redraw under an open confirmation, a form being filled in, the admin list or the stats being looked at
    // ... nor while the weekly email is being edited (Announcements tab)
    const typing = document.activeElement && (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable);
    if (!state.asking && state.tab !== "admin" && !statsTab && !typing && !(state.tab === "announcements" && state.commEdit && state.commEdit.size)) render();
    else if (moved) render();   // a remembered tab this person may no longer see was switched above: draw the new one
    else { setPc(); renderTabs(); }
  } catch (e) { screen(el("section", { class: "card" }, "Could not load the status: " + (e.message || e))); }
  state.timer = setTimeout(refresh, anyActive() ? 5000 : 20000);
}

function demoRpc(fn, a) {
  if (fn === "stream_set_manual") { if (a.p_manual) state.control.set(a.p_run_key, { run_key: a.p_run_key, note: a.p_note, set_by: "demo@example.org", set_at: new Date().toISOString() }); else state.control.delete(a.p_run_key); return; }
  if (fn === "stream_request_test") { if (state.requests.some(q => q.status === "pending" || q.status === "running")) throw new Error("A test is already waiting or running");
    state.requests.unshift({ id: Date.now(), source_key: a.p_source_key, mode: a.p_mode, status: "pending", requested_by: "demo@example.org", requested_at: new Date().toISOString(), test_key: `${ymd(new Date())}_Test${a.p_source_key.slice(11)}` }); return 1; }
  if (fn === "stream_request_stop") { if (!state.stops.some(x => x.run_key === a.p_run_key && x.status === "pending"))
      state.stops.unshift({ id: Date.now(), run_key: a.p_run_key, status: "pending", requested_by: "demo@example.org", requested_at: new Date().toISOString() }); return 1; }
  if (fn === "stream_cancel_request") { const q = state.requests.find(x => x.id === a.p_id); if (q) q.status = "cancelled"; return; }
  if (fn === "stream_admin_add_user") { const e = a.p_email.toLowerCase(); const u = state.users.find(x => x.email === e);
    if (u) { u.note = a.p_note || u.note; u.is_admin = !!a.p_admin; } else state.users.push({ email: e, note: a.p_note, is_admin: !!a.p_admin, general: true, announcements: false, thoughts: false, added_at: new Date().toISOString(), added_by: "demo" }); return; }
  if (fn === "stream_set_hymn_rights") { return; }
  if (fn === "stream_admin_set_access") { const u = state.users.find(x => x.email === a.p_email); if (u) u[a.p_what] = !!a.p_on; return; }
  if (fn === "stream_admin_remove_user") { if (a.p_email === "russ.koehl@morrisnorth.org") throw new Error("You cannot remove yourself"); state.users = state.users.filter(x => x.email !== a.p_email); return; }
}

// ------------------------------------------------------------------ start
async function boot() {
  if (demo) { state.user = { email: "russ.koehl@morrisnorth.org" }; state.admin = params.get("admin") !== "0"; /* &admin=0: see the page as a non-admin */
    state.thoughts = params.get("thoughts") !== "0";   /* &thoughts=0 / &general=0 / &ann=0: that box not checked */
    state.general = params.get("general") !== "0"; state.annOk = params.get("ann") !== "0"; $("#who").textContent = "demo"; await refresh(); return; }
  const cfg = window.STREAM_CONFIG;
  if (!cfg || !window.supabase) { screen(el("div", { class: "center" }, el("h2", {}, "Configuration missing"), el("p", {}, "config.js or the Supabase library did not load."))); return; }
  state.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);   // same defaults as the HVAC page
  $("#signout").onclick = () => state.sb.auth.signOut();
  const onSession = async (session) => {
    state.user = session?.user || null;
    $("#signout").style.display = state.user ? "" : "none";
    $("#who").textContent = state.user ? (state.user.email || "") : "";
    clearTimeout(state.timer);
    if (!state.user) { showLogin(); return; }
    const me = String(state.user.email || "").toLowerCase();
    // "*": works before and after supabase\stream_status_11.sql adds the thoughts column
    const { data, error } = await state.sb.from("stream_allowed_users").select("*");
    const mine = !error && (data || []).find(r => String(r.email).toLowerCase() === me);
    if (!mine) { showNotAllowed(state.user.email); return; }
    state.admin = !!mine.is_admin;
    // the check boxes per person on the Admin tab (Russ, 2026-11-22); before _11.sql has run: as before (all but Thoughts)
    state.general = "general" in mine ? !!mine.general : true;
    state.annOk = "announcements" in mine ? !!mine.announcements : true;
    state.thoughts = !!mine.thoughts;
    screen(el("p", { class: "hint", style: "text-align:center;margin-top:20vh" }, "Loading…"));
    await refresh();
  };
  const hash = location.hash || "";
  if (/error=/.test(hash)) {
    const q = new URLSearchParams(hash.slice(1));
    history.replaceState(null, "", location.pathname);
    showLogin("Sign-in problem: " + (q.get("error_description") || q.get("error") || "unknown") + ". Please try again.");
    return;
  }
  const { data: { session } } = await state.sb.auth.getSession();
  await onSession(session);
  state.sb.auth.onAuthStateChange((event, s) => { if (event === "SIGNED_IN" || event === "SIGNED_OUT") onSession(s); });
}
// every web or email link on the page opens in a new tab (Russ, 2026-11-22: "If they click any link on a PC, it should
// open in a new tab"); links inside the page (#...) stay as they are
document.addEventListener("click", (e) => {
  const a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
  if (!a || a.target) return;
  if (/^(https?:|mailto:)/i.test(a.getAttribute("href") || "")) { a.target = "_blank"; a.rel = "noopener"; }
}, true);
boot();
})();
